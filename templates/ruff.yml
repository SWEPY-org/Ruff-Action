spec:
  inputs:
    image:
      description: "Image for the job."
      default: ghcr.io/astral-sh/ruff:0.12.2-alpine3.21
      regex: ^(?<image>[a-z0-9.\-_]+(?:/[a-z0-9.\-_]+|)+)(:(?<tag>[\w.\-_]{1,127})|)$
    stage:
      description: Stage of the job.
      default: test
    target-paths:
      description: Directories to lint.
      default: .
    options:
      description: Options for both format and check commands.
      default: ""
    check-options:
      description: Options for check command.
      default: --output-format gitlab
    format-options:
      description: Options for format command.
      default: --diff

---

.ruff-base:
  variables:
    RUFF_TARGET_PATHS: $[[ inputs.target-paths ]]
    RUFF_OPTIONS: $[[ inputs.options ]]
  image: $[[ inputs.image ]]
  interruptible: true
  stage: $[[ inputs.stage ]]
  needs: []
  before_script:
    - ruff --version

lint:ruff:check:
  extends: .ruff-base
  variables:
    RUFF_CHECK_DEFAULT_OPTIONS: $[[ inputs.check-options ]]
    RUFF_CHECK_OPTIONS: ""
  script:
    - ruff check $RUFF_OPTIONS $RUFF_CHECK_DEFAULT_OPTIONS $RUFF_CHECK_OPTIONS $RUFF_TARGET_PATHS  > $CI_PROJECT_DIR/code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

lint:ruff:format:
  extends: .ruff-base
  variables:
    RUFF_FORMAT_DEFAULT_OPTIONS: $[[ inputs.format-options ]]
    RUFF_FORMAT_OPTIONS: ""
  script:
    - ruff format $RUFF_GLOBAL_OPTIONS $RUFF_FORMAT_DEFAULT_OPTIONS $RUFF_FORMAT_OPTIONS $RUFF_TARGET_PATHS
