include:
  - component: $CI_SERVER_FQDN/swepy/cicd-templates/release-by-changelog/release-on-tag@2.0.0
  - component: $CI_SERVER_FQDN/swepy/cicd-templates/bump-my-version/bump-my-version@0.1.2
  - project: $CI_PROJECT_NAMESPACE/ruff
    ref: $CI_COMMIT_SHA
    file: templates/ruff.yml
    inputs:
      target-paths: tests/ruff_project

.many_folder:
  variables:
    RUFF_TARGET_PATHS: tests/ruff_project/src tests/ruff_project/tests

ruff_check_many_folder:
  extends:
    - ruff:check
    - .many_folder

ruff_format_many_folder:
  extends:
    - ruff:format
    - .many_folder
