[tool.bumpversion]
commit = true
current_version = "6.0.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
replace = "{new_version}"
search = "{current_version}"
serialize = [
    "{major}.{minor}.{patch}",
]
tag = true
tag_name = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
replace = """## [Unreleased]

[![Pipeline](https://gitlab.com/swepy/cicd-templates/ruff/badges/trunk/pipeline.svg)](https://gitlab.com/swepy/cicd-templates/ruff/-/pipelines)

## [{new_version}] - {now:%Y-%m-%d}

[![Pipeline](https://gitlab.com/swepy/cicd-templates/ruff/badges/{new_version}/pipeline.svg)](https://gitlab.com/swepy/cicd-templates/ruff/-/pipelines)
"""
search = """## [Unreleased]

[![Pipeline](https://gitlab.com/swepy/cicd-templates/ruff/badges/trunk/pipeline.svg)](https://gitlab.com/swepy/cicd-templates/ruff/-/pipelines)
"""

[[tool.bumpversion.files]]
filename = "README.md"

[[tool.bumpversion.files]]
filename = "docs/gitlab.md"

[[tool.bumpversion.files]]
filename = "templates/ruff.yml"
replace = "Ruff component version {new_version}"
search = "Ruff component version {current_version}"
